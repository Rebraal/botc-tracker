<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BotC Tracker V10.6.25</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-panel">
    <button id="btn-toggle-setup" onclick="toggleSetupMode()">Lock Setup</button>
    <button id="btn-restart-game" onclick="triggerRestartGame()">Restart Game</button>
    <button id="btn-new-game" class="danger" onclick="triggerNewGame()">New Game</button>
    <button id="btn-next-day" onclick="triggerNextDay()">Next Day</button>
    <span id="version-tag" style="color:#888; font-size:0.75rem; font-weight:bold; margin-left:5px;">V10.6.25</span>
  </div>

  <div id="game-board-container">
    <div id="game-board">
      <div id="center-dashboard">
        <button id="btn-nominate" onclick="handleNominateClick()">Nominate</button>
        <div id="composition-panel"></div>
        <div id="live-stats-panel">
          <div id="alive-count-display">Players Alive: <span id="alive-val" style="color:#00ff66;">0</span></div>
          <div id="threshold-display">Threshold: <span id="threshold-val" style="color:#ffd700;">0</span></div>
          <div id="current-votes-display">Current Votes: <span id="votes-val" style="color:#00ffcc;">0</span></div>
        </div>
        <div id="dashboard-box">
          <div id="workflow-prompt">Workflow Prompt</div>
          <div id="role-input-container" style="display:none; margin:5px 0; width:100%;">
            <input type="text" id="input-token-role" placeholder="Enter role..." style="width:65%; font-size:0.75rem; padding:3px;">
            <button id="btn-save-role" style="padding:3px 6px; font-size:0.75rem;">Set</button>
          </div>
          <div id="notification-line">System Ready</div>
        </div>
      </div>
      <div id="tokens-layer"></div>
    </div>
  </div>

  <div id="roster-management-panel">
    <h3>Roster Management</h3>
    <div style="display:flex; gap:5px; margin-bottom:10px;">
      <input type="text" id="input-player-name" placeholder="Enter player name..." autofocus>
      <button onclick="addPlayerFromInput()">Add</button>
    </div>
    <div id="roster-list"></div>
  </div>

  <div id="notes-panel" style="width:100%; max-width:500px; background:#222; border:1px solid #444; border-radius:8px; padding:10px; margin-top:15px; box-sizing:border-box;">
    <h3>Notes</h3>
    <textarea id="storyteller-notes" placeholder="Type night actions, custom bluffs, or reminders here..." style="width:100%; height:100px; background:#141414; color:#fff; border:1px solid #444; border-radius:4px; padding:8px; font-family:inherit; font-size:0.85rem; box-sizing:border-box; resize:vertical;"></textarea>
  </div>

  <div id="ledger-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:8px;">
      <h3 style="margin:0;">Grimoire Log Ledger</h3>
      <button onclick="clearAllNVToggles()" style="font-size:0.75rem; padding:4px 8px; margin-left:auto; background-color:#555;">Clear nomination info</button>
    </div>
    <div id="ledger-content"></div>
  </div>

  <!-- Micro-Module Architectural Scripts -->
  <script src="js_core.js"></script>
  <script src="js_layout.js"></script>
  <script src="js_life.js"></script>
  <script src="js_nominations.js"></script>
  <script src="js_roster.js"></script>
  <script src="js_ledger.js"></script>
</body>
